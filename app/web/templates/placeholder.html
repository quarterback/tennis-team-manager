{% extends "base.html" %}
{% block title %}Play to Clinch — {{ title }}{% endblock %}
{% block content %}
<div class="bl-container" style="padding-top:40px; padding-bottom:60px; max-width:760px">
  <div class="bl-note new" style="border-radius:8px">
    <div style="font-family:var(--font-display); font-weight:800; font-size:24px; color:var(--text-primary); letter-spacing:-0.01em; margin-bottom:6px">{{ title }}</div>
    <div style="font-size:14.5px; color:var(--brand-strong); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:10px">Roadmap {{ phase }}</div>
    <p style="font-size:15.5px; color:var(--text-secondary); line-height:1.6; margin:0">{{ blurb }}</p>
  </div>
</div>
{% endblock %}
