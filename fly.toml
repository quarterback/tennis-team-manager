# fly.toml app configuration file generated for tennis-team-manager on 2026-06-07T05:38:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tennis-team-manager'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  TENNIS_DB_PATH = '/data/tennis.db'

# Persistent volume for saved seasons (season mode is DB-backed).
# `initial_size` lets `fly deploy` auto-create the volume when a machine needs
# one and none exists — so deploys work without a manual `fly volume create`.
[[mounts]]
  source = 'tennis_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  # Stay awake like the other sims (viperball / hybrid-baseball) — the
  # hub's sync was waking this machine every cycle anyway.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '30s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
