# fly.toml app configuration file generated for tennis-team-manager on 2026-06-07T05:38:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tennis-team-manager'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  TENNIS_DB_PATH = '/data/tennis.db'

# Persistent volume for saved seasons (season mode is DB-backed).
# `initial_size` lets `fly deploy` auto-create the volume when a machine needs
# one and none exists — so deploys work without a manual `fly volume create`.
[[mounts]]
  source = 'tennis_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  # ALWAYS-ON (owner decision 2026-07-07, supersedes the brief 'stop, min=0'
  # experiment). Even with the power_index thread-race fixed, the 07-07 morning
  # logs show autostop itself doing damage: boot warm pegs the worker →
  # /api/health starves → machine marked unhealthy → proxy routes nothing →
  # autostopper reads that as "excess capacity" and KILLS the machine MID-BUILD
  # (SIGTERM + /data EBUSY unmount = SQLite yanked mid-write, journal recovery on
  # next boot) → cold reboot → warm restarts → repeat. And the original 'suspend'
  # idle design silently died at the 16GB resize (Fly caps suspend at 8GB), so
  # idle handling was always a full stop. min_machines_running = 1 keeps the one
  # machine up through unhealthy windows so the warm always finishes and the
  # volume is never yanked.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  # The app runs ONE gunicorn worker (keeps the season/roster cache warm), so a
  # heavy CPU-bound request — first-advance signing, which runs the junior circuit
  # for both genders, or a recruit/data board build — holds the GIL and blocks
  # /api/health for tens of seconds. A short check timeout then marks the machine
  # unhealthy mid-compute and drops/recycles it, which re-primes cold on the next
  # load: the "slow + crashing on load" loop. A generous timeout/grace lets a
  # legitimate compute finish and the check pass once the worker frees the GIL.
  # grace_period covers the FULL cold boot warm (~minutes) so the first build
  # never flags the machine; the thread pool is sized (gunicorn --threads 32) so
  # page requests piling up behind the warm can't starve /api/health of a thread.
  [[http_service.checks]]
    interval = '60s'
    timeout = '150s'
    grace_period = '300s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  cpu_kind = 'performance'
  cpus = 4
  memory = '16gb'
