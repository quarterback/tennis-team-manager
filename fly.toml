# fly.toml app configuration file generated for tennis-team-manager on 2026-06-07T05:38:19Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tennis-team-manager'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8080'
  TENNIS_DB_PATH = '/data/tennis.db'

# Persistent volume for saved seasons (season mode is DB-backed).
# `initial_size` lets `fly deploy` auto-create the volume when a machine needs
# one and none exists — so deploys work without a manual `fly volume create`.
[[mounts]]
  source = 'tennis_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8080
  force_https = true
  # Fully manual on/off — nothing automatic ever touches the machine:
  #   * auto_stop_machines = 'off'  -> Fly NEVER auto-stops. A machine you
  #     start stays up while you use it (it will NOT get shut off mid-session
  #     just because traffic goes quiet). Stop it yourself when done:
  #     `fly machine stop --app tennis-team-manager` (or `fly scale count 0`).
  #   * auto_start_machines = false -> a stopped machine is NOT woken by
  #     incoming requests, so it stays off (no charges) until you start it
  #     with `fly machine start --app tennis-team-manager` (or `fly scale count 1`).
  # Trade-off: since nothing auto-stops it, YOU must remember to stop it when
  # finished or it keeps running and billing.
  auto_stop_machines = 'off'
  auto_start_machines = false
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '30s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  cpu_kind = 'performance'
  cpus = 2
  memory = '4gb'
