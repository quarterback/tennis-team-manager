# Fly.io deployment for tennis-team-manager.
# Deploys run from the GitHub Action (.github/workflows/deploy.yml) on push to
# main, which builds THIS Dockerfile and deploys it (no cached image).
app = "tennis-team-manager"
primary_region = "iad"

# Build the gunicorn Dockerfile (NOT a buildpack — that produced the broken
# `flask run` image).
[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"   # snapshot+resume keeps the in-memory cache warm
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  # Env-accurate sizing. Season aggregation is CPU-bound (~2s on first hit per
  # universe, then cached); bump to a dedicated CPU if first hits feel slow.
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
