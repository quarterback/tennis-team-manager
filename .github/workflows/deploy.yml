name: Deploy to Fly.io

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:   # manual trigger from the GitHub Actions UI (web button)

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # First run creates the app from fly.toml; later runs are a no-op.
      - name: Ensure Fly app exists
        run: flyctl apps create tennis-team-manager || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Persistent volume for saved seasons (season mode). Idempotent.
      - name: Ensure data volume exists
        run: |
          if ! flyctl volumes list -a tennis-team-manager | grep -q tennis_data; then
            flyctl volumes create tennis_data -a tennis-team-manager -r iad -n 1 -y
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        run: |
          # --ha=false: deploy a SINGLE machine. The app runs one gunicorn
          # worker with an in-process cache (see wsgi.py), so it is
          # single-machine by design — and a single machine needs only the
          # one `tennis_data` volume, which fly auto-creates from the mount's
          # initial_size. (HA would spin up a 2nd machine needing a 2nd volume
          # that nothing provisions, which is what was failing the deploy.)
          for attempt in 1 2 3; do
            echo "Deploy attempt $attempt..."
            if flyctl deploy --remote-only --ha=false; then
              echo "Deploy succeeded on attempt $attempt"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep_time=$((attempt * 10))
              echo "Deploy failed, retrying in ${sleep_time}s..."
              sleep "$sleep_time"
            fi
          done
          echo "Deploy failed after 3 attempts"
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Verify deployment health
        run: |
          echo "Waiting for deployment to stabilize..."
          sleep 30
          for attempt in 1 2 3 4 5; do
            echo "Health check attempt $attempt..."
            status=$(curl -s -o /dev/null -w "%{http_code}" https://tennis-team-manager.fly.dev/api/health || true)
            if [ "$status" = "200" ]; then
              echo "Health check passed (HTTP 200)"
              exit 0
            fi
            echo "Got HTTP $status, retrying in 15s..."
            sleep 15
          done
          echo "WARNING: Health check did not return 200 after 5 attempts"
          exit 1
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
